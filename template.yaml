AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  URL Shortener API - Proyecto de portafolio AWS (Pablo Cueto Gatica).
  Arquitectura serverless: API Gateway -> Lambda -> DynamoDB.
  Fase 2: seguridad con API Gateway API Key + Secrets Manager.
  Mapea a temario AWS Certified Developer - Associate (DVA-C02):
  Dominio 1 (Lambda, DynamoDB, APIs), Dominio 2 (IAM least-privilege,
  API Keys, Secrets Manager), Dominio 3 (SAM / Infrastructure as Code).

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.13

Resources:
  # ---------------------------------------------------------------
  # TABLA DYNAMODB
  # ---------------------------------------------------------------
  UrlShortenerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: url-shortener-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shortcode
          AttributeType: S
      KeySchema:
        - AttributeName: shortcode
          KeyType: HASH

  # ---------------------------------------------------------------
  # SECRETO: token de administrador (Fase 2 - Secrets Manager)
  # ---------------------------------------------------------------
  AdminTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: url-shortener/admin-token
      Description: Token para autorizar operaciones administrativas (ej. borrar shortcodes)
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "token"
        PasswordLength: 32
        ExcludePunctuation: true

  # ---------------------------------------------------------------
  # FUNCION LAMBDA
  # ---------------------------------------------------------------
  UrlShortenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: url_shortener_function/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE_NAME: !Ref UrlShortenerTable
          ADMIN_SECRET_ARN: !Ref AdminTokenSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlShortenerTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref AdminTokenSecret
      Events:
        CreateShortUrl:
          Type: Api
          Properties:
            Path: /shorten
            Method: post
            Auth:
              ApiKeyRequired: true
        RedirectShortUrl:
          Type: Api
          Properties:
            Path: /{shortcode}
            Method: get
            # Publico a proposito: es el endpoint que usan los usuarios finales al hacer click
        GetStats:
          Type: Api
          Properties:
            Path: /stats/{shortcode}
            Method: get
            Auth:
              ApiKeyRequired: true
        DeleteShortUrl:
          Type: Api
          Properties:
            Path: /admin/{shortcode}
            Method: delete
            Auth:
              ApiKeyRequired: true

  # ---------------------------------------------------------------
  # API KEY + USAGE PLAN (Fase 2 - seguridad de API Gateway)
  # ---------------------------------------------------------------
  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ServerlessRestApiProdStage
    Properties:
      UsagePlanName: url-shortener-usage-plan
      ApiStages:
        - ApiId: !Ref ServerlessRestApi
          Stage: Prod
      Throttle:
        RateLimit: 10
        BurstLimit: 20
      Quota:
        Limit: 1000
        Period: MONTH

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - ServerlessRestApiProdStage
    Properties:
      Name: url-shortener-api-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref ServerlessRestApi
          StageName: Prod

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  ApiEndpoint:
    Description: "URL base de la API (API Gateway)"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UrlShortenerFunctionArn:
    Description: "ARN de la funcion Lambda"
    Value: !GetAtt UrlShortenerFunction.Arn
  UrlShortenerTableName:
    Description: "Nombre de la tabla DynamoDB"
    Value: !Ref UrlShortenerTable
  ApiKeyId:
    Description: "ID de la API Key (obtener valor con: aws apigateway get-api-key --api-key <ID> --include-value --query value --output text)"
    Value: !Ref ApiKey
  AdminSecretArn:
    Description: "ARN del secreto admin"
    Value: !Ref AdminTokenSecret